# Development settings only; Home Assistant installs the integration from custom_components/.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# py313 keeps `except (A, B):` parenthesised; the 3.14 form without parentheses is easy to misread.
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The GraphQL field list reads better unwrapped.
"custom_components/digitraffic_live/trains.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
known-third-party = ["homeassistant"]
